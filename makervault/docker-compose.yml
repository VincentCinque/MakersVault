services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FILE_STORAGE=/app/storage
      - DB_URL=sqlite:////app/data/app.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./data/storage:/app/storage
      - ./data/db:/app/data
      - ./api:/app
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      # IMPORTANT: This URL must be reachable by the browser, not by the container.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - api
